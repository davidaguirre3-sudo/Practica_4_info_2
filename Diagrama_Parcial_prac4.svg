<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Diagrama de clases parcial: Red y Enrutador (distribución horizontal)</title>
  <desc>Red es el todo y contiene de 0 a N Enrutador. Un Enrutador se conecta con de 0 a N Enrutador.</desc>

  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1">
    <rect x="40" y="40" width="300" height="164"/>
    <line x1="40" y1="68" x2="340" y2="68"/>
    <line x1="40" y1="100" x2="340" y2="100"/>

    <line x1="362" y1="84" x2="480" y2="84"/>

    <rect x="480" y="40" width="300" height="236"/>
    <line x1="480" y1="68" x2="780" y2="68"/>
    <line x1="480" y1="136" x2="780" y2="136"/>

    <path d="M530 276 L530 311 L730 311 L730 276"/>
  </g>

  <polygon points="340,84 351,78 362,84 351,90" fill="#000000" stroke="#000000" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000" text-anchor="middle">
    <!-- Red -->
    <text x="190" y="59" font-size="14" font-weight="bold">Red</text>
    <text x="190" y="88">- map&lt;string,Enrutador&gt; enrutadores_</text>
    <text x="190" y="120">+ bool agregarEnrutador(string)</text>
    <text x="190" y="138">+ bool agregarEnlace(string, string, int)</text>
    <text x="190" y="156">+ bool existeEnrutador(string)</text>
    <text x="190" y="174">+ Enrutador * obtenerEnrutador(string)</text>
    <text x="190" y="192">+ void imprimirTablas(ostream&amp;)</text>

    <!-- Enrutador -->
    <text x="630" y="59" font-size="14" font-weight="bold">Enrutador</text>
    <text x="630" y="88">- string nombre_</text>
    <text x="630" y="106">- map&lt;string,int&gt; vecinos_</text>
    <text x="630" y="124">- map&lt;string,int&gt; tablaCostos_</text>
    <text x="630" y="156">+ Enrutador(string)</text>
    <text x="630" y="174">+ void agregarVecino(string, int)</text>
    <text x="630" y="192">+ bool esVecino(string)</text>
    <text x="630" y="210">+ int costoEnlace(string)</text>
    <text x="630" y="228">+ void inicializarTabla()</text>
    <text x="630" y="246">+ int costoA(string)</text>
    <text x="630" y="264">+ void imprimirTabla(ostream&amp;)</text>

    <!-- Cardinalidades y nombre de la asociacion -->
    <text x="372" y="76" text-anchor="start">1</text>
    <text x="472" y="76" text-anchor="end">0..N</text>
    <text x="538" y="296" text-anchor="start">0..N</text>
    <text x="722" y="296" text-anchor="end">0..N</text>
    <text x="630" y="336">Se conecta con&gt;</text>
  </g>
</svg>
